[project]
name = "rag-streamlit-frontend"
version = "0.2.0"
requires-python = ">=3.11"

dependencies = [
    # ── Ядро UI ──────────────────────────────────────────────
    # Экстра pdf — компонент streamlit-pdf под st.pdf. Без него атрибут st.pdf
    # всё равно есть, но падает при вызове (StreamlitAPIException), поэтому
    # проверить его наличие через hasattr нельзя — только поставить.
    "streamlit[pdf]>=1.58.0",
    "streamlit-authenticator>=0.4.2",   # логин + cookie-сессия (готовый компонент)
    "streamlit-pdf-viewer>=0.0.29",     # просмотр PDF с аннотациями
    "streamlit-aggrid>=1.2.1.post2",    # таблицы CSV/Excel
    "st-link-analysis>=0.4.0",          # граф знаний (Cytoscape, JS в бандле)
    # ── Документы ────────────────────────────────────────────
    "pypdf>=6.14.2",                    # размеры страниц для bbox
    "mammoth>=1.12.0",                  # DOCX → HTML
    "pandas>=2.2.0",                    # CSV/Excel
    "openpyxl>=3.1.0",                  # чтение .xlsx
    # ── Инфраструктура ───────────────────────────────────────
    "s3fs>=2026.6.0",                   # хранилище исходников
    "httpx>=0.28.1",                    # клиенты сервисов
    "tenacity>=9.1.4",                  # ретраи сетевых вызовов
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "loguru>=0.7.3",                    # структурный лог, как в бэкендах
]

[dependency-groups]
dev = ["ruff>=0.15.20"]

[tool.ruff]
line-length = 88
target-version = "py311"

# ==================== LINTER ====================
[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "C4", "UP", "B", "SIM", "PL", "RUF",
]

fixable = ["ALL"]

ignore = [
    "E501",     # line too long
    "E402",     # imports not at top (page_config должен идти первым)
    "TC001",    # type-checking imports
    "TC002",
    "TC003",
    "RUF012",   # mutable defaults
    "PLW1508",  # env var default
    "RET504",   # unnecessary assignment before return
    "SIM108",   # prefer ternary

    # Русский язык
    "RUF001",
    "RUF002",
    "RUF003",
]

# ==================== FORMATTER ====================
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
